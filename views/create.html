<body>
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <div class="main-content">

        <!-- 🔵 Branding -->
        <div style="text-align: center; margin-right: 100px;">
            <img src="/images/logo.png" alt="QuickChat Logo" class="logo-left">
            <h1 class="logo-text">QuickChat</h1>
            <p class="slogan">Simple Speedy</p>
        </div>

        <!-- 🔄 Flip Card -->
        <div class="card-container">
            <div class="card" id="card">

                <!-- FRONT = CREATE -->
                <div class="side front">
                    <div class="lottie">
                        <lottie-player src="/images/Animation.json"
                            background="transparent" speed="1" loop autoplay>
                        </lottie-player>
                    </div>

                    <h2>Get Instant Access</h2>

                    <form action="/create" method="POST" onsubmit="return validateForm(event)">
                       <input name="username" id="username" placeholder="Full Name" class="text-input" />
                       <input name="email" type="email" placeholder="Email Address" class="text-input" />
                       <input name="password" type="password" placeholder="Password" class="text-input" />

                       <p class="error-msg" style="color: red; display: none;"></p>
                       <button type="submit">Create</button>
                    </form>

                    <p class="toggle-text">
                        Already have an account? <a onclick="flip()">Login</a>
                    </p>
                </div>

                <!-- BACK = LOGIN -->
                <div class="side back">
                    <div class="lottie">
                        <lottie-player src="/images/Animation.json"
                            background="transparent" speed="1" loop autoplay>
                        </lottie-player>
                    </div>

                    <h2>Welcome Back!</h2>

                    <form action="/login" method="POST" onsubmit="return validateForm(event)">
                        <input name="email" type="email" placeholder="Email Address" class="text-input" />
                        <input name="password" type="password" placeholder="Password" class="text-input" />

                        <p class="error-msg" style="color: red; display: none;"></p>
                        <button type="submit">Login</button>
                    </form>
                    
                    <div class="social-divider">
                      <span>Or continue with</span>
                    </div>

                    <div class="social-login">

                        <button class="social-btn" onclick="loginWithGoogle()">
                            <i class="fab fa-google"></i>
                        </button>
                        
                        <button class="social-btn" onclick="loginWithFacebook()">
                            <i class="fab fa-facebook"></i>
                        </button>

                    </div>

                    <p class="toggle-text">
                        Don't have an account? <a onclick="flip()">SignUp</a>
                    </p>
                </div>

            </div>
        </div>

    </div>
